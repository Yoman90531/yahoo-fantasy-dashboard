name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify backend
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/fantasy-ci.db
        run: |
          pip install -r requirements.txt
          python scripts/migrate_database.py
          python -m alembic -c alembic.ini check
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        env:
          DATABASE_URL: sqlite:////tmp/fantasy-openapi.db
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- ../openapi.json src/types/api.generated.ts
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          password: ${{ secrets.DROPLET_PASSWORD }}
          command_timeout: 15m
          script: |
            set -eu
            cd /opt/yahoo-fantasy-dashboard
            git pull --ff-only origin main

            docker compose build app
            docker compose run --rm --no-deps app python scripts/backup_database.py
            docker compose run --rm --no-deps app python scripts/migrate_database.py
            docker compose pull caddy
            if ! docker compose up -d --remove-orphans; then
              docker compose logs --tail=200 app caddy
              exit 1
            fi
            docker compose up -d --force-recreate --no-deps caddy
            docker compose ps

            healthy=0
            for attempt in $(seq 1 60); do
              if curl -fsS https://vibedan.duckdns.org/fantasy/api/health; then
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              docker compose logs --tail=100 app caddy
              exit 1
            fi

            curl -fsS https://vibedan.duckdns.org/health
